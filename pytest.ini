[pytest]
asyncio_default_fixture_loop_scope = module
asyncio_mode = auto
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
minversion = 6.0
addopts = -ra -q -m "not framework_compat"
pythonpath = .
testpaths =
    tests
markers =
    integration: requires a running platform + ClickHouse (opt-in: `pytest -m integration`)
    framework_compat: framework version-compatibility matrix probes (opt-in: `pytest -m framework_compat`)
    real_span_exporter: build AuditSender's real OTLP exporter instead of the in-memory stand-in tests/conftest.py installs