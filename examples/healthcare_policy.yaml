version: 1
# Generated by `hexgate register`. Edit freely — re-running register
# never overwrites this; it only updates the manifest snapshot.
#
# Four entries:
#   read_only  (mixin)  factored-out 'safe to read' allowlist
#   default             fallback when no User scope is set
#   member              typical user; writes + shells require approval
#   admin               power user; writes allow, shells still gate
#
# Note: 'admin' here is an AGENT policy role (used by the SDK at request
# time via User(role="admin")), distinct from the ORG admin role on
# /orgs/:id/members.

# Heuristic could not classify these tools — treating as writes
# (fail-closed). Move them to read_only or shells as appropriate:
#   - order_lab_test
#   - prescribe
#   - prescribe_controlled
#   - share_record

roles:
    # Shared clinical read base. is_mixin keeps it out of the selectable
    # roles — it only exists to be inherited from.
    clinical_base:
      is_mixin: true
      default_policy: { mode: deny }
      tools:
        get_patient_record: { mode: allow }
        view_lab_results:   { mode: allow }

    # Fallback when no role (or an unknown role) is active. Fail closed:
    # everything denied.
    default:
      default_policy: { mode: deny }

    # Nurse: clinical reads + order labs. Cannot prescribe or share PHI.
    nurse:
      inherits: [clinical_base]
      default_policy: { mode: deny }
      tools:
        order_lab_test:       { mode: allow }
        prescribe:            { mode: deny }
        prescribe_controlled: { mode: deny }
        share_record:         { mode: deny }

    # Physician: full clinical authority. Controlled substances route
    # through a human approval gate; PHI can only leave to allowlisted
    # domains (an external personal inbox fails the constraint → denied).
    physician:
      inherits: [clinical_base]
      default_policy: { mode: deny }
      tools:
        order_lab_test: { mode: allow }
        prescribe:      { mode: allow }
        prescribe_controlled: { mode: allow }
        share_record:
          mode: allow
          constraints:
            - args.recipient_domain in ["clinic.org", "questdiagnostics.com", "labcorp.com"]

    # Billing: claims/billing lookups only. Clinical data is walled off —
    # no clinical_base inheritance, so get_patient_record etc. fall to the
    # deny default.
    billing_staff:
      default_policy: { mode: deny }
      tools:
        get_billing_summary: { mode: allow }