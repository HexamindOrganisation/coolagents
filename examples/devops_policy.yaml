# Role-aware policy for examples/devops_agent.py
#
# Paste this into the platform policy editor for the `devops_agent` agent
# (the SDK pulls it by agent name at run time). Allow / deny only — no
# approval gates in this demo.
#
# The escalation ladder, least → most privileged:
#   default  < operator < admin
#   (read)     (dev/staging ops)  (everything, prod included)
#
# Fail-closed everywhere: `mode` defaults to deny, so any tool a role
# doesn't explicitly allow is denied. `default` is the baseline (read logs)
# and the fallback when User.role is unset or unknown.

version: 1

roles:
  # ---- mixin: read-only base shared by every human role -----------------
  # is_mixin keeps it out of the selectable roles — it only exists to be
  # inherited from. read_logs is the one thing everyone can do.
  read_only:
    is_mixin: true
    tools:
      read_logs:
        mode: allow

  # ---- default: read logs, nothing else ---------------------------------
  # The baseline, and the fallback when no role (or an unknown role) is on
  # the User. Reads service logs; everything else is denied.
  default:
    inherits: [read_only]
    default_policy:
      mode: deny

  # ---- operator: day-to-day ops, dev/staging only -----------------------
  # Restart and scale freely below the cap, but prod is walled off (the
  # env constraint fails verbatim) and there are no destructive ops.
  operator:
    inherits: [read_only]
    default_policy:
      mode: deny
    tools:
      restart_service:
        mode: allow
        constraints:
          - args.env in ["dev", "staging"]
      scale_deployment:
        mode: allow
        constraints:
          - args.env in ["dev", "staging"]
          - args.replicas <= 10

  # ---- admin: lifts the env bounds, higher cap, can delete --------------
  # Inherits operator, then OVERRIDES the env-bounded tools with looser
  # entries (child entry replaces parent by tool name) — prod included,
  # cap raised to 200. The only role allowed to delete_resource.
  admin:
    inherits: [operator]
    default_policy:
      mode: deny
    tools:
      restart_service:
        mode: allow
      scale_deployment:
        mode: allow
        constraints:
          - args.replicas <= 200
      delete_resource:
        mode: allow
