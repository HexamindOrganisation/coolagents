# Role-aware policy for examples/hr_agent.py
#
# Paste this into the platform policy editor for the `hr_agent` agent (the
# SDK pulls it by agent name at run time). Allow / deny only.
#
# Three roles, least → most privileged (each inherits the one before it and
# only ADDS or LOOSENS):
#
#   default < manager < gestionnaire_rh
#   (annuaire + champs annuaire)  (+ équipe)   (paie, médical, export, offboarding)
#
# Two ideas do the heavy lifting:
#
#   1. FIELD-LEVEL SCOPING on a single read tool. `get_employee_data` is one
#      tool taking a `field` argument; each role ALLOWs it but constrains
#      `args.field` to a widening allowlist. Same tool, same employee — the
#      requested FIELD plus the caller's ROLE decide. (Demo A.)
#
#   2. ONE MODE PER TOOL. The engine attaches a single mode to each tool
#      entry, so a capability that is gated DIFFERENTLY (allowed for some
#      fields, approval-gated for one) cannot live on the same entry. The
#      ultra-sensitive medical read is therefore its OWN tool,
#      `get_medical_leave`, exactly as the healthcare demo split
#      `prescribe` from `prescribe_controlled`. `medical_leave` is kept OUT
#      of every `get_employee_data` allowlist so health data can only ever
#      leave through the approval-gated tool. (Demo C.)
#
# Numeric ceilings (export_payroll count) live HERE, outside the LLM — a
# prompt-injected agent cannot raise its own cap, so it can't siphon the
# whole payroll. (Demo D.)
#
# Fail-closed everywhere: default_policy is deny, so any tool a role does not
# explicitly allow is denied.

version: 1

roles:
  # ---- default: annuaire self-service (the authenticated baseline) -------
  # Merges the old default / annuaire_base / collaborateur into one role.
  # Reads the internal directory and ONLY the four annuaire fields of an
  # employee record. No sensitive field, no write. `default` is also the
  # fallback when User.role is unset or unknown.
  default:
    default_policy: { mode: deny }
    tools:
      search_directory: { mode: allow }
      get_employee_data:
        mode: allow
        constraints:
          - args.field in ["title", "department", "manager", "work_email"]
      # Self-service — every authenticated employee may manage their OWN time
      # off. The tools are scoped to the caller identity (not an arg), so there
      # is nothing to gate beyond allowing them.
      get_my_leave_balance: { mode: allow }
      request_time_off:     { mode: allow }
      list_my_time_off:     { mode: allow }

  # ---- manager: + son équipe ---------------------------------------------
  # Adds leave_balance and performance_rating to the readable fields (scope
  # to "son équipe" is enforced in the tool body, which the constraint engine
  # cannot see). Still no salary, no medical, no bank_account, no write.
  manager:
    inherits: [default]
    default_policy: { mode: deny }
    tools:
      get_employee_data:
        mode: allow
        constraints:
          - args.field in ["title", "department", "manager", "work_email", "leave_balance", "performance_rating"]

  # ---- gestionnaire_rh: paie / médical / export / offboarding ------------
  # Merges the old gestionnaire_rh and drh into one senior role. Reads every
  # non-medical field; holds the aggregated compensation view; may read
  # medical leave, change salaries, and trigger offboarding. export_payroll
  # stays volume-capped at 1000 so a runaway request can't dump the whole
  # company's payroll.
  gestionnaire_rh:
    inherits: [manager]
    default_policy: { mode: deny }
    tools:
      get_employee_data:
        mode: allow
        constraints:
          - args.field in ["title", "department", "manager", "work_email", "leave_balance", "performance_rating", "salary", "contract", "bank_account"]
      get_medical_leave:
        mode: allow
      update_salary:
        mode: allow
      view_compensation:
        mode: allow
      export_payroll:
        mode: allow
        constraints:
          - args.count <= 1000
      offboard_employee:
        mode: allow
