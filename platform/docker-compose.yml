# DEV-INFRA ONLY: just the databases, ports published to localhost so you run
# the API natively (hot-reload). The full containerized stack (api included) is
# platform/docker-compose.deploy.yml. Driven via `make clickhouse-*`/`postgres-*`.

services:
  postgres:
    image: postgres:16
    container_name: hexgate-postgres
    ports:
      # Loopback-only, offset from 5432 (committed creds; coexists with a
      # local Postgres).
      - "127.0.0.1:5433:5432"
    environment:
      # LOCAL DEV ONLY — never reuse these credentials anywhere deployed.
      POSTGRES_DB: hexgate
      POSTGRES_USER: hexgate
      POSTGRES_PASSWORD: ${HEXGATE_POSTGRES_PASSWORD:-hexgate-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexgate -d hexgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: hexgate-clickhouse
    ports:
      # Offset from the 8123/9000 defaults to coexist with other local
      # instances; loopback-only since the dev credentials are committed.
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Applied once on an empty data volume; not a migration system.
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      # LOCAL DEV ONLY — never reuse these credentials anywhere deployed.
      CLICKHOUSE_DB: hexgate_audit
      CLICKHOUSE_USER: hexgate
      CLICKHOUSE_PASSWORD: ${HEXGATE_CLICKHOUSE_PASSWORD:-hexgate-dev-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: hexgate-kafka
    ports:
      # Not offset like postgres/clickhouse above — nothing commonly binds
      # 9092 locally, and advertised.listeners below must match this port
      # exactly or clients get redirected to the wrong port on reconnect.
      - "127.0.0.1:9092:9092"
    environment:
      # Single-node KRaft mode (broker + controller combined) — no
      # ZooKeeper. LOCAL DEV ONLY: PLAINTEXT, no auth, fixed cluster id
      # (not a secret, just an identity for this dev cluster's storage —
      # same "committed dev creds" pattern as postgres/clickhouse above).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: Y53xctxPRGixoc3BnBGhkQ
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clickhouse-data:
  postgres-data:
  kafka-data:
