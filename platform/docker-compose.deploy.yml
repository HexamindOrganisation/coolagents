# Per-environment stack: postgres + clickhouse + api on one private network.
# The api serves both /v1 and the dashboard SPA same-origin (no separate edge).
# Run once per env as a distinct Compose PROJECT, which isolates its network +
# volumes:
#   make platform-up STAGE=prod      # -p hexgate-prod    --env-file platform/.env.prod
#   make platform-up STAGE=staging   # -p hexgate-staging --env-file platform/.env.staging
#
# The api listens plain HTTP on a loopback port (HEXGATE_HTTP_PORT: 7000 prod /
# 7200 staging); the box's existing reverse proxy owns 80/443 + TLS and routes
# to it by hostname (see platform/DEPLOY.md). Secrets/per-deploy values live in
# .env.<env>.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hexgate
      POSTGRES_USER: hexgate
      # No dev default: a missing password fails the deploy.
      POSTGRES_PASSWORD: ${HEXGATE_POSTGRES_PASSWORD:?set HEXGATE_POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexgate -d hexgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: hexgate_audit
      CLICKHOUSE_USER: hexgate
      CLICKHOUSE_PASSWORD: ${HEXGATE_CLICKHOUSE_PASSWORD:?set HEXGATE_CLICKHOUSE_PASSWORD in .env.prod}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-data:/var/lib/clickhouse
      # Runs once on an empty volume (not migrations) — same schema.sql as dev.
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Built locally by compose; pulled if REGISTRY/TAG are set. Serves both the
    # JSON API (/v1) and the dashboard SPA same-origin — no separate edge.
    image: ${REGISTRY:-hexgate}/hexgate-api:${TAG:-latest}
    build:
      context: ..
      dockerfile: platform/api/Dockerfile
      args:
        # Build-time only: Vite bakes VITE_* into the SPA bundle at `pnpm build`,
        # so the preview banner can't be a runtime env. Interpolated from the
        # --env-file the Makefile passes (.env.<env>), NOT the service env_file
        # below. Unset → empty → banner off.
        VITE_PREVIEW_BANNER: ${VITE_PREVIEW_BANNER:-}
    # amd64: the API image bundles the amd64-only OPA binary.
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # Loopback only: the box's reverse proxy reaches this and terminates TLS,
      # but it's never directly internet-facing. (If that proxy runs as a
      # bridged container it can't reach 127.0.0.1 — publish on a shared network
      # or a non-loopback port instead.)
      - "127.0.0.1:${HEXGATE_HTTP_PORT:?set HEXGATE_HTTP_PORT in .env.<env>}:8000"
    # Secrets + app config; DATABASE_URL is assembled by the app, not here. The path is
    # parameterized so each project loads its OWN env (HEXGATE_ENV is set inside
    # each .env.<env>) — `--env-file` only drives ${...} interpolation, not this.
    env_file:
      - .env.${HEXGATE_ENV:-prod}
    environment:
      # Fixed topology, not per-deploy. Port 8123 = ClickHouse HTTP interface
      # (clickhouse_connect is an HTTP client, not native 9000).
      HEXGATE_CLICKHOUSE_HOST: clickhouse
      HEXGATE_CLICKHOUSE_PORT: "8123"
      # Postgres topology. The app assembles + percent-encodes DATABASE_URL from
      # these plus HEXGATE_POSTGRES_PASSWORD (loaded via env_file above), so the
      # password may contain ANY characters — no URL-safe restriction. Host/db/
      # user match the postgres service; only the port is fixed here.
      HEXGATE_POSTGRES_HOST: postgres
      HEXGATE_POSTGRES_PORT: "5432"
      # Persistent keystore — losing it invalidates every token/session/bundle.
      HEXGATE_KEYSTORE_PATH: /keys
    volumes:
      - hexgate-keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # Liveness from the image's HEALTHCHECK (/health).

  # ── OTLP ingest pipeline: SDK → collector → redpanda → enricher → ClickHouse ──

  redpanda:
    # Pinned, unlike dev's :latest. Single-node buffer, PLAINTEXT with no
    # auth/ACLs — safe ONLY because it exposes no host port: every client
    # (collector, enricher) is a sibling on this compose network. Never add
    # a `ports:` entry here.
    image: redpandadata/redpanda:v26.2.2
    restart: unless-stopped
    command:
      - redpanda
      - start
      # dev-container bundles the single-node tuning flags, including
      # --unsafe-bypass-fsync: a hard crash can lose in-flight messages.
      # Accepted deliberately — this broker is a buffer, not the system of
      # record (ClickHouse is; see redpanda/init/create-topics.sh), and the
      # whole audit pipeline already prefers dropping to blocking.
      - --mode
      - dev-container
      # One listener, advertised as the service name. Dev's second
      # (localhost:9092) listener exists for host-native processes; here
      # every client is a container, so it would only be an unreachable
      # advertised address waiting to bite a reconnect.
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-init:
    # One-shot: creates the two topics + disables auto-creation, then exits 0
    # (the script is idempotent). Dev runs the same script via `make
    # redpanda-topics` (docker exec); compose has no exec, hence a sibling
    # container — which is why the script takes the admin API address as env.
    image: redpandadata/redpanda:v26.2.2
    restart: "no"
    entrypoint: ["bash", "/init/create-topics.sh"]
    environment:
      HEXGATE_REDPANDA_BOOTSTRAP_SERVER: redpanda:9092
      HEXGATE_REDPANDA_ADMIN_API: redpanda:9644
    volumes:
      - ./redpanda/init:/init:ro
    depends_on:
      redpanda:
        condition: service_healthy

  collector:
    image: ${REGISTRY:-hexgate}/hexgate-collector:${TAG:-latest}
    build:
      context: ./collector
    restart: unless-stopped
    ports:
      # Loopback only, same contract as the api service: the box's reverse
      # proxy routes the path /v1/traces on the api hostname here, which is
      # what makes the SDK's default endpoint (<api url>/v1/traces) work
      # with zero client config. See DEPLOY.md §3.
      - "127.0.0.1:${HEXGATE_OTLP_PORT:?set HEXGATE_OTLP_PORT in .env.<env>}:4318"
    environment:
      # In-container binds; the image's config.yaml defaults to loopback.
      HEXGATE_COLLECTOR_HTTP_ENDPOINT: 0.0.0.0:4318
      HEXGATE_COLLECTOR_GRPC_ENDPOINT: 0.0.0.0:4317
      HEXGATE_REDPANDA_BOOTSTRAP_SERVER: redpanda:9092
      # The api's first boot writes this into the shared volume (see the
      # api service's keystore comment); mounted read-only below.
      HEXGATE_COLLECTOR_PUBLIC_KEY_FILE: /keys/hexgate.pub
      # Keyword/value DSN with the password deliberately left out: pgx reads
      # PGPASSWORD itself (the extension validates with the same parser), so
      # the secret never has to be URL-encoded or quoted — any characters
      # are fine, matching the api's DATABASE_URL assembly.
      HEXGATE_COLLECTOR_POSTGRES_DSN: host=postgres port=5432 dbname=hexgate user=hexgate
      PGPASSWORD: ${HEXGATE_POSTGRES_PASSWORD:?set HEXGATE_POSTGRES_PASSWORD in .env.<env>}
    volumes:
      - hexgate-keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      # Not for traffic — for /keys/hexgate.pub: the biscuit-auth extension
      # refuses to start without it, and the api's first boot creates it.
      api:
        condition: service_healthy
    healthcheck:
      # TCP-connect probe: the ocb manifest builds no health extension into
      # the collector, so there is no HTTP endpoint to hit. bash ships in the
      # image's bookworm-slim base.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4318"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  enricher:
    # Same image as the api — the job lives inside hexgate_api and reads the
    # same settings, so one image serves both roles and they cannot drift.
    # `command` overrides the image CMD (uvicorn); no ports, outbound only.
    image: ${REGISTRY:-hexgate}/hexgate-api:${TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "python", "-m", "hexgate_api.jobs.enricher"]
    env_file:
      - .env.${HEXGATE_ENV:-prod}
    environment:
      HEXGATE_CLICKHOUSE_HOST: clickhouse
      HEXGATE_CLICKHOUSE_PORT: "8123"
      HEXGATE_POSTGRES_HOST: postgres
      HEXGATE_POSTGRES_PORT: "5432"
      HEXGATE_REDPANDA_BOOTSTRAP_SERVER: redpanda:9092
    healthcheck:
      # The image HEALTHCHECK probes uvicorn's :8000/health, which this
      # process doesn't serve — inherited, it would mark the enricher
      # permanently unhealthy.
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      # Not for traffic — the api's startup init_db() creates the Postgres
      # tables the resolver reads, so a fresh volume never surfaces as
      # "no such table" on the first consumed span (same reason
      # `make enricher-run` runs postgres-init first).
      api:
        condition: service_healthy

volumes:
  pg-data:
  ch-data:
  hexgate-keys:
  redpanda-data:
