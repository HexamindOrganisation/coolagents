# Runtime config for the hexgate-collector binary (built via
# `make collector-generate` + `make collector-build`, or `make
# collector-run` for both). Dev-only defaults throughout — not
# load-tested, not the real auth.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Values are reasonable dev defaults, not load-tested.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource-level (whole batch) provenance tag — a real, common use of
  # this processor, not just a placeholder. Where a real deployment would
  # also stamp deployment.environment, service.instance.id, etc.
  resource:
    attributes:
      - key: collector.name
        value: hexgate-collector
        action: upsert

  # Span-level placeholder — proves the wiring point exists. No real
  # per-span transformation decided yet: the design doc assigns
  # redaction/byte-capping to the enrichment job downstream, not this
  # Collector, so this processor doesn't have a real job yet either.
  attributes:
    actions:
      - key: collector.stage
        value: ingest
        action: upsert

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  kafka:
    # localhost, not the kafka:29092 container-network listener — this
    # binary is meant to run natively on the host for local dev, same
    # convention as `make platform-api`. See platform/docker-compose.yml.
    brokers: [localhost:9092]
    traces:
      topic: hexgate.otlp.raw
      encoding: otlp_proto
      # Real value once the Biscuit auth extension (separate PR) sets
      # "project_id" in the request's client metadata — bearertokenauth
      # below doesn't. Until then this key is simply absent and every
      # span falls back to random partition assignment.
      message_key_from_metadata_key: project_id
    record_partitioner:
      # Hashes whatever message_key_from_metadata_key resolves to, so
      # the same project_id always lands on the same partition.
      sticky_key:
        hasher: murmur2

extensions:
  bearertokenauth:
    # Placeholder auth for this scaffold — accepts one fixed token,
    # nothing like real Biscuit verification. LOCAL DEV ONLY, same
    # "committed dev creds" pattern as the Kafka/Postgres/ClickHouse
    # services in platform/docker-compose.yml.
    token: hexgate-scaffold-stub-token

service:
  extensions: [bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [kafka]
